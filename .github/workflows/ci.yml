name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Host tests
        run: nix develop --command make test
      - name: Firmware build
        run: nix develop --command make fw
      - name: Flash/XDATA budget
        run: nix develop --command make size
      - name: Interrupt vectors and overlay
        run: nix develop --command make check-interrupts
      - name: Bring-up stages 1 to 3
        run: nix develop --command make stages
      - uses: actions/upload-artifact@v4
        with:
          name: oblio-hex
          path: build/oblio.hex
      - uses: actions/upload-artifact@v4
        with:
          name: oblio-stages
          path: build/stage*/oblio.hex

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: oblio-hex
      - uses: softprops/action-gh-release@v2
        with:
          files: oblio.hex
