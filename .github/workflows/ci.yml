name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Host tests
        run: nix develop --command make test
      - name: API reference is up to date
        run: nix develop --command make check-api
      - name: Firmware build
        run: nix develop --command make fw
      - name: Flash/XDATA budget
        run: nix develop --command make size
      - name: The version is in the image, and a tag says the same number
        run: |
          nix develop --command python3 tools/check_version.py build/oblio.hex
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then nix develop --command python3 tools/check_version.py build/oblio.hex --tag "${GITHUB_REF_NAME}"; fi
      - name: Web updater (Node tests + a whole update in headless Chrome)
        run: nix develop --command make web-test
      - name: Interrupt vectors and overlay
        run: nix develop --command make check-interrupts
      # The artifact is the default build (with the battery log): it has to be taken BEFORE the build without the log below, which overwrites build/oblio.hex
      - uses: actions/upload-artifact@v4
        with:
          name: oblio-hex
          path: build/oblio.hex
      - name: The same without the battery log (BATTERY_LOG=0)
        run: nix develop --command make BATTERY_LOG=0 fw size

  simulation:
    # The real firmware in the simulator of the chip: boot, interrupts, USB enumeration, the raw HID pipe, key reports, the recovery chord.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Simulation tests
        run: nix develop --command make sim

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # to start pages.yml
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: oblio-hex
      - uses: softprops/action-gh-release@v2
        with:
          files: oblio.hex
      # The site of the web updater lists every release, so it has to be rebuilt now. It cannot be deployed from a tag (the github-pages environment
      # only accepts the branch main), so this asks the Pages workflow to run ON main.
      - name: Rebuild the web updater's site (pages.yml, on main)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "${GITHUB_REPOSITORY}" --ref main
